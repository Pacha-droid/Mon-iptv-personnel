name: Mise a jour Playlist Mondial 2026

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Recuperer le code
      uses: actions/checkout@v4

    - name: Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Installer les dependances
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Executer le script
      run: python "update script.py"

    - name: Enregistrer les modifications
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        touch playlist_mondial.m3u
        git add playlist_mondial.m3u
        git commit -m "Mise a jour automatique des flux" || echo "Aucun changement detecte"
        git push || echo "Erreur lors du push"




